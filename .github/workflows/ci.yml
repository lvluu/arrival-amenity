name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4 # keep in sync with mise.toml
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build

  # Every push to main is a patch release: v<major>.<minor>.<commits since vX.Y.0> (scripts/version.ts).
  release:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags and history for the patch count
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4 # keep in sync with mise.toml
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v$(bun scripts/version.ts)"
          if [ "$v" = "vdev" ]; then echo "no vX.Y.0 tag yet"; exit 1; fi
          gh release view "$v" >/dev/null 2>&1 || gh release create "$v" --target "$GITHUB_SHA" --title "$v" --generate-notes
