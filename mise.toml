# One toolchain for every machine and agent: `mise install`, then `mise run check`.
[tools]
bun = "1.4.4"

[tasks.install]
run = "bun install --frozen-lockfile"

[tasks.dev]
description = "Build, then serve on http://localhost:8787"
run = "bun run dev"

[tasks.check]
description = "Gate for every change: typecheck + lint + format check + tests"
run = "bun run check"

[tasks.deploy]
description = "Build and deploy the Worker (static assets); fetches tags first so the version is right"
run = "git fetch -q --tags origin && bun run deploy"

[tasks.bugs]
description = "Bug reports from the app: list, or `mise run bugs -- <id>` to download one into bugs/<id>/"
run = "bun scripts/bugs.ts"
