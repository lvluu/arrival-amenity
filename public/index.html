<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arrival Fruit</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg">
  <meta name="theme-color" content="#2f5d50">
  <style>
    :root { --bg: #fff; --fg: #1d1d1b; --muted: #6b6b66; --line: #e3e1da; --accent: #2f5d50; --warn: #a15c00; --warn-bg: #fff4e0; }
    @media (prefers-color-scheme: dark) { :root { --bg: #161615; --fg: #ecebe6; --muted: #9c9b95; --line: #33322f; --accent: #7fb8a6; --warn: #f0b860; --warn-bg: #3a2c12; } }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 16px/1.4 system-ui, sans-serif; max-width: 720px; margin-inline: auto; }
    h1 { font-size: 1.3rem; margin: 0 0 12px; }
    .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 16px; }
    label.file { background: var(--accent); color: var(--bg); padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; }
    label.file input { display: none; }
    input[type=number] { width: 4em; font: inherit; padding: 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
    .totals { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 12px 0; }
    .totals div { border: 1px solid var(--line); border-radius: 8px; padding: 8px; text-align: center; }
    .totals b { display: block; font-size: 1.5rem; }
    .totals .fruit b { color: var(--accent); }
    table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    th, td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: left; }
    th { color: var(--muted); font-weight: 500; font-size: .85rem; }
    td.n, th.n { text-align: right; }
    td.names { color: var(--muted); font-size: .85rem; }
    tr.warn td { background: var(--warn-bg); }
    .note { color: var(--warn); font-size: .85rem; }
    .muted { color: var(--muted); font-size: .9rem; }
    details { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; margin-bottom: 16px; }
    summary { cursor: pointer; font-weight: 600; }
    h3 { font-size: 1rem; margin: 16px 0 4px; }
    .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .grid3 label { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; color: var(--muted); }
    .grid3 input, .types input { width: 100%; }
    .types { max-width: 320px; }
    .types td, .types th { padding: 4px 6px; }
    .add { display: flex; gap: 8px; margin: 8px 0; max-width: 320px; }
    .add input { flex: 1; min-width: 0; font: inherit; padding: 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
    button { font: inherit; padding: 6px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); cursor: pointer; }
    button.link { border: 0; padding: 0; color: var(--accent); text-decoration: underline; }
    h2 { font-size: 1.1rem; margin: 24px 0 4px; }
    tr[data-page] { cursor: pointer; }
    figure { margin: 12px 0; }
    figcaption { color: var(--muted); font-size: .85rem; }
    #evidence canvas { width: 100%; height: auto; border: 1px solid var(--line); background: #fff; }
    @media (max-width: 480px) { td.names, th.names { display: none; } }
  </style>
</head>
<body>
  <h1>Arrival Fruit</h1>
  <div class="controls">
    <label class="file">Open arrival PDF<input id="file" type="file" accept="application/pdf"></label>
  </div>
  <details id="settings">
    <summary>Settings</summary>
    <p class="muted">Fruit per villa = bedrooms × per bedroom + adults × per adult + per villa. Saved on this device.</p>
    <div class="grid3">
      <label>Per bedroom <input id="fruitPerBedroom" type="number" min="0" max="99"></label>
      <label>Per adult <input id="fruitPerAdult" type="number" min="0" max="99"></label>
      <label>Per villa <input id="fruitPerVilla" type="number" min="0" max="99"></label>
    </div>
    <h3>Room types</h3>
    <table class="types"><thead><tr><th>Code</th><th>Bedrooms</th><th></th></tr></thead><tbody id="roomTypes"></tbody></table>
    <form id="addType" class="add">
      <input id="newCode" placeholder="Code, e.g. RP4" required pattern="[A-Za-z][A-Za-z0-9]{0,9}" aria-label="New room type code">
      <input id="newBeds" type="number" min="0" max="99" value="1" required aria-label="Bedrooms">
      <button type="submit">Add</button>
    </form>
    <button type="button" id="resetSettings" class="link">Reset to defaults</button>
  </details>
  <p id="status" class="muted">PDF stays on this device. Nothing is uploaded.</p>
  <div id="out"></div>
  <div id="evidence"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
